<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a0c13">
<title>Christmas Workshop · Make it merry</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #f8eee4;
    --muted: #c5aab0;
    --gold: #f5ce93;
    --line: #f3c89133;
    --surface: #2d151d;
    --serif: Georgia, "Times New Roman", serif;
    --sans: system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100svh;
    background:
      radial-gradient(ellipse at 11% 2%, #401822 0%, transparent 54%),
      radial-gradient(ellipse at 85% 97%, #29121d 0%, transparent 60%),
      #190d15;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button, canvas { -webkit-tap-highlight-color: transparent; }
  :is(button, canvas, input, select, a):focus-visible { outline: 2px solid #ffda9e; outline-offset: 3px; }
  button:disabled { opacity: .48; cursor: default; }
  .shell { width: min(100% - 96px, 1360px); margin: auto; }
  .masthead {
    min-height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 12px; color: var(--gold); }
  .seal {
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    border: 1px solid #ecc48775;
    border-radius: 50%;
  }
  .brand-name { font-size: 14px; font-weight: 600; letter-spacing: .15em; color: var(--ink); }
  .mast-controls { display: flex; gap: 7px; }
  .quiet {
    border: 1px solid transparent;
    background: transparent;
    border-radius: 5px;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 11px;
    min-height: 44px;
    font-size: 12px;
  }
  .quiet:hover, .quiet[aria-pressed="true"] { background: #f8d8a610; color: var(--gold); border-color: var(--line); }
  .icon { width: 17px; height: 17px; flex: none; }
  .layout {
    --rail: clamp(285px, 29vw, 382px);
    display: grid;
    grid-template-columns: var(--rail) minmax(0, 1fr);
    grid-template-areas: "intro scene" "tools scene";
    grid-template-rows: max-content 1fr;
    column-gap: clamp(26px, 4.2vw, 70px);
    row-gap: 15px;
    padding-block: 23px 26px;
  }
  .intro { grid-area: intro; padding-top: 7px; }
  .eyebrow {
    display: flex;
    align-items: center;
    gap: 11px;
    margin: 0 0 9px;
    color: var(--gold);
    font: 11px Georgia, serif;
    letter-spacing: .29em;
    text-transform: uppercase;
  }
  .eyebrow::before { content: ""; width: 23px; height: 1px; background: #d7a469; }
  h1 { margin: 0; font: 700 clamp(46px, 4.36vw, 70px)/1.02 var(--serif); letter-spacing: -.052em; }
  h1 span { display: block; color: var(--gold); font-style: italic; }
  .intro-copy { margin: 9px 0 0; color: var(--muted); line-height: 1.6; }
  .workshop { grid-area: tools; min-width: 0; }
  .workshop-actions { display: grid; grid-template-columns: 1.13fr 1fr; gap: 7px; margin-top: 9px; }
  .primary {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    min-height: 44px;
    padding: 9px 12px;
    border: 1px solid #ffdb9e;
    border-radius: 5px;
    background: linear-gradient(110deg, #ffe2ae, #e8b174);
    color: #321519;
    font-weight: 700;
    letter-spacing: .08em;
    text-align: left;
    box-shadow: 0 6px 24px #e7a35720;
    transition: background .18s ease, box-shadow .18s ease;
  }
  .primary:hover { background: #ffe8be; box-shadow: 0 6px 26px #e7a35745; }
  .primary, .secondary { justify-content: center; gap: 6px; font-size: 13px; letter-spacing: 0; text-decoration: none; white-space: nowrap; }
  .secondary {
    display: inline-flex; align-items: center; min-height: 44px; padding: 8px;
    border: 1px solid #eac08870; border-radius: 5px; color: var(--gold); background: #f2c28d10;
  }
  .secondary:hover { background: #f2c28d26; }
  .settings, .customizer {
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: linear-gradient(136deg, #52243248, #2d151d78);
  }
  .settings { margin-top: 9px; }
  .customizer { padding-top: 4px; }
  .customizer legend, .settings legend { padding-inline: 2px; }
  .ornament-tray { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
  .ornament-option {
    min-width: 0; min-height: 45px; padding: 2px 0 4px; display: grid; justify-items: center; align-content: center;
    border: 1px solid #e6bc9e26; border-radius: 4px; color: var(--muted); background: #190d1661;
    cursor: grab; touch-action: none; font-size: 10px; line-height: 1.15; white-space: nowrap; user-select: none;
  }
  .ornament-option:hover { border-color: #e6bc9e80; color: var(--ink); }
  .ornament-option[aria-pressed="true"] { background: #f2c28d22; border-color: #eac088c0; color: #ffe1ad; }
  .ornament-thumb { width: 28px; height: 28px; object-fit: contain; pointer-events: none; }
  .ornament-option .icon { width: 21px; height: 21px; margin: 3.5px 0; color: var(--gold); }
  .color-control { display: flex; gap: 8px; align-items: center; margin-top: 7px; }
  .color-control label { color: #e9cbbb; font-size: 12px; white-space: nowrap; }
  select, .card-controls input {
    min-height: 38px; color: var(--ink); font: inherit;
    border: 1px solid #e6bc9e55; border-radius: 4px; background: #24111a; padding: 5px 8px;
  }
  .color-control select { flex: 1; min-width: 0; font-size: 12px; }
  .color-control input { min-width: 44px; height: 38px; padding: 3px; border: 1px solid #e6bc9e55; border-radius: 4px; background: #24111a; cursor: pointer; }
  #drag-ornament { position: fixed; z-index: 3; top: 0; left: 0; width: 63px; height: 63px; pointer-events: none; filter: drop-shadow(0 0 10px #f8ba70); }
  .scene[data-drop-active="true"] { border-color: var(--gold); }
  .scene[data-drop-active="true"] .hint { color: var(--gold); border-color: var(--gold); }
  fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
  legend, .settings h2 { padding: 0; margin: 0 0 9px; font-size: 12px; color: #e9cbbb; font-weight: 600; letter-spacing: .09em; }
  .themes, .toggles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .theme, .toggle {
    min-width: 0;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding-inline: 3px;
    background: #190d1661;
    border: 1px solid #e6bc9e26;
    border-radius: 4px;
    white-space: nowrap;
    font-size: 11px;
    color: var(--muted);
  }
  .theme:hover, .toggle:hover { color: var(--ink); border-color: #e6bc9e80; }
  .theme[aria-pressed="true"] { background: #f2c28d19; border-color: #eac088a0; color: #ffdfad; }
  .toggle[aria-pressed="true"] { color: var(--gold); border-color: #e6bc9e4f; background: #e6bc9e14; }
  .toggle .icon { width: 15px; height: 15px; }
  .swatch { width: 11px; height: 11px; flex: none; border-radius: 50%; border: 1px solid #ffe6bd80; background: var(--swatch); }
  .effects { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
  .scene {
    grid-area: scene;
    position: relative;
    isolation: isolate;
    min-width: 0;
    align-self: start;
    height: max(520px, calc(100svh - 122px));
    margin: 0;
    overflow: hidden;
    border: 1px solid #daae7663;
    border-radius: 7px;
    background:
      radial-gradient(ellipse at 50% 49%, var(--aura, #65192b) 0%, transparent 62%),
      radial-gradient(ellipse at 50% 100%, #62332a8a, transparent 52%),
      linear-gradient(153deg, #30131e, #130912 76%);
    transition: background .35s ease;
  }
  .scene[data-theme="rose"] { --aura: #63233e; }
  .scene[data-theme="frost"] { --aura: #293a55; }
  .scene::after {
    content: "";
    position: absolute;
    inset: 8px;
    border: 1px solid #dfb67c27;
    border-radius: 4px;
    pointer-events: none;
    background:
      linear-gradient(var(--gold),var(--gold)) top left / 12px 1px,
      linear-gradient(var(--gold),var(--gold)) top left / 1px 12px,
      linear-gradient(var(--gold),var(--gold)) top right / 12px 1px,
      linear-gradient(var(--gold),var(--gold)) top right / 1px 12px,
      linear-gradient(var(--gold),var(--gold)) bottom left / 12px 1px,
      linear-gradient(var(--gold),var(--gold)) bottom left / 1px 12px,
      linear-gradient(var(--gold),var(--gold)) bottom right / 12px 1px,
      linear-gradient(var(--gold),var(--gold)) bottom right / 1px 12px;
    background-repeat: no-repeat;
    opacity: .65;
  }
  #tree { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: pan-y; }
  #tree.dragging { cursor: grabbing; }
  #tree:focus-visible { outline-offset: -9px; }
  .scene-top, .scene-caption {
    position: absolute;
    z-index: 1;
    left: 24px;
    right: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 9px;
    pointer-events: none;
  }
  .scene-top { top: 20px; }
  .scene-caption { bottom: 20px; justify-content: flex-end; }
  .count, .hint {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #f1d6bc;
    font-size: 11px;
    background: #170b16b5;
    border: 1px solid #eac08845;
    border-radius: 999px;
    padding: 6px 10px;
    backdrop-filter: blur(6px);
  }
  .count .icon, .hint .icon { width: 13px; height: 13px; color: var(--gold); }
  .scene-action { pointer-events: auto; min-height: 38px; padding-inline: 11px; font: inherit; font-size: 11px; }
  .scene-action:hover { color: #fff6e3; border-color: var(--gold); }
  .gift-layer { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  .gift-hotspot {
    position: absolute; width: max(44px, var(--gift-width, 44px)); height: max(44px, var(--gift-height, 44px));
    transform: translate(-50%, -50%); border: 1px solid transparent; border-radius: 7px;
    padding: 0; background: transparent; pointer-events: auto;
  }
  .gift-hotspot:is(:hover, :focus-visible) { border-color: #ffdda5bd; background: #ffda9e16; box-shadow: 0 0 20px #ffda9e43; }
  .gift-note {
    position: absolute; z-index: 3; left: 50%; top: 52%; transform: translate(-50%, -50%);
    width: min(370px, calc(100% - 42px)); padding: 20px 23px 17px;
    background: radial-gradient(ellipse at top, #512536, #2a121d 75%);
    border: 1px solid #eac088b0; outline: 1px solid #eac08845; outline-offset: -6px;
    border-radius: 8px; box-shadow: 0 10px 50px #11060ec0, 0 0 25px #ffc17238; text-align: center;
  }
  .gift-note .icon { width: 26px; height: 26px; color: var(--gold); }
  .gift-note h2 { margin: 7px 0 8px; color: #ffdfab; font: 700 26px/1.12 var(--serif); }
  .gift-note p { margin: 0; color: #f2d9cd; line-height: 1.55; }
  .gift-note .quiet { color: var(--gold); min-height: 38px; padding-block: 6px; margin-top: 8px; }
  .card-dialog {
    width: min(690px, calc(100% - 28px)); max-height: calc(100% - 28px); padding: 19px;
    border: 1px solid #eac08880; border-radius: 8px; color: var(--ink);
    background: linear-gradient(145deg,#3b1a27,#231119); box-shadow: 0 15px 80px #0b040ad0;
  }
  .card-dialog::backdrop { background: #10060bd0; backdrop-filter: blur(5px); }
  .card-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .card-heading h2 { margin: 0; font: 700 26px var(--serif); color: var(--gold); }
  .card-heading form { margin: 0; }
  .card-body { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: center; gap: 20px; }
  #card-preview { display: block; width: 100%; height: auto; border-radius: 3px; box-shadow: 0 7px 24px #12070f90; }
  .card-controls { min-width: 0; }
  .card-controls label { display: block; font-size: 13px; color: var(--gold); margin-bottom: 6px; }
  .card-controls input { width: 100%; min-height: 44px; }
  .card-controls input + label { margin-top: 10px; }
  .card-controls .primary { margin-top: 10px; }
  #download-card[aria-disabled="true"] { opacity: .6; cursor: wait; }
  .card-controls p { margin: 8px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
  }

  @media (max-width: 900px) {
    .shell { width: calc(100% - 48px); }
    .layout { column-gap: 22px; --rail: 265px; }
    h1 { font-size: 48px; }
    .ornament-option { font-size: 9px; }
  }
  @media (max-width: 680px) {
    .shell { width: calc(100% - 30px); }
    .masthead { min-height: 63px; }
    .brand { gap: 8px; }
    .brand-name { max-width: 120px; font-size: 12px; letter-spacing: .045em; }
    .seal { flex: none; width: 32px; height: 32px; }
    .mast-controls { gap: 1px; }
    .quiet { padding: 8px 7px; }
    .layout {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto;
      grid-template-areas: "intro" "scene" "tools";
      gap: 14px;
      padding-top: 16px;
    }
    .intro { padding-top: 0; }
    .eyebrow { margin-bottom: 8px; font-size: 9px; }
    h1 { font-size: clamp(29px, 7.6vw, 49px); line-height: 1.2; letter-spacing: -.055em; }
    h1 span { display: inline; }
    .intro-copy { margin-top: 5px; font-size: 12px; }
    .scene { height: clamp(370px, 51svh, 460px); }
    .scene-top, .scene-caption { left: 16px; right: 16px; }
    .scene-top { top: 16px; }
    .scene-caption { bottom: 16px; }
    .hint { font-size: 10px; padding: 6px 7px; }
    .scene-caption .hint .icon { display: none; }
    .gift-note h2 { font-size: 22px; }
  }
  @media (max-width: 520px) {
    .card-dialog { padding: 12px; }
    .card-body { grid-template-columns: 1fr; gap: 12px; }
    #card-preview { width: min(100%, 290px); margin: auto; }
    .card-controls input { font-size: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
</style>
</head>

<svg xmlns="http://www.w3.org/2000/svg" class="sr-only" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="M9.9 2 12 7l5 2.1-5 2.1-2.1 5-2.1-5L3 9.1 7.8 7zM18 13v6m-3-3h6M5 15v4m-2-2h4"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><ellipse cx="6" cy="18" rx="3" ry="2"/><ellipse cx="18" cy="16" rx="3" ry="2"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 1 9 9 9 9 0 0 1-6.4-2.6M3 4v8h8"/></symbol>
    <symbol id="i-card" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m3 15 5-5 5 5 3-3 5 5"/><circle cx="16" cy="8" r="1"/></symbol>
    <symbol id="i-bauble" viewBox="0 0 24 24"><path d="M10 6V4a2 2 0 0 1 4 0v2m-5 1h6m-9 7a6 6 0 0 1 6-6m-4 7a4 4 0 0 1 4-4"/><circle cx="12" cy="14" r="7"/></symbol>
    <symbol id="i-snow" viewBox="0 0 24 24"><path d="M12 2v20m-4-18 4 4 4-4m-8 16 4-4 4 4M3.3 7l17.4 10M3 12.5 8.5 11 7 5.5m10 13  -1.5-5.5 5.5-1.5M3.3 17 20.7 7M7 18.5 8.5 13 3 11.5m18 1L15.5 11 17 5.5"/></symbol>
    <symbol id="i-orbit" viewBox="0 0 24 24"><path d="M20.5 8A9 9 0 0 0 4 7m0-4v4h4m-4.5 9A9 9 0 0 0 20 17m0 4v-4h-4"/><circle cx="12" cy="12" r="2"/></symbol>
    <symbol id="i-move" viewBox="0 0 24 24"><path d="M4 12h16m-12-4-4 4 4 4m8-8 4 4-4 4"/></symbol>
  </defs>
</svg>
<div class="shell">
  <header class="masthead">
    <div class="brand">
      <div class="seal"><svg class="icon" aria-hidden="true"><use href="#i-sparkles"/></svg></div>
      <div>
        <div class="brand-name">Christmas Workshop</div>
      </div>
    </div>
    <div class="mast-controls" aria-label="Scene controls">
      <button class="quiet" id="sound" type="button" aria-pressed="false">
        <svg class="icon" aria-hidden="true"><use href="#i-music"/></svg>Music
      </button>
      <button class="quiet" id="reset" type="button">
        <svg class="icon" aria-hidden="true"><use href="#i-reset"/></svg>Reset
      </button>
    </div>
  </header>
  <main class="layout">
    <section class="intro" aria-labelledby="title">
      <p class="eyebrow">Merry Christmas</p>
      <h1 id="title">Make it<span> merry.</span></h1>
      <p class="intro-copy">Drag an ornament from the tray onto a branch.</p>
    </section>

    <figure class="scene" id="scene" data-theme="classic">
      <canvas id="tree" tabindex="0" aria-label="Interactive Christmas tree" aria-describedby="tree-help">
        Your browser could not display the Christmas tree animation.
      </canvas>
      <div class="scene-top">
        <button class="hint scene-action" id="intro-action" type="button">
          <svg class="icon" aria-hidden="true"><use href="#i-sparkles"/></svg><span id="intro-label">Replay fireworks</span>
        </button>
        <span class="count"><svg class="icon" aria-hidden="true"><use href="#i-bauble"/></svg>Ornaments <strong id="count">0</strong></span>
      </div>
      <figcaption class="scene-caption">
        <span class="hint"><svg class="icon" aria-hidden="true"><use href="#i-move"/></svg><span id="scene-hint">Click to hang · Drag to spin</span></span>
      </figcaption>
      <div class="gift-layer" id="gift-layer" role="group" aria-label="Gifts beneath the tree" hidden>
        <button class="gift-hotspot" id="gift-0" type="button" aria-label="Open the cranberry gift" aria-controls="gift-note"></button>
        <button class="gift-hotspot" id="gift-1" type="button" aria-label="Open the copper gift" aria-controls="gift-note"></button>
        <button class="gift-hotspot" id="gift-2" type="button" aria-label="Open the red gift" aria-controls="gift-note"></button>
        <button class="gift-hotspot" id="gift-3" type="button" aria-label="Open the gold gift" aria-controls="gift-note"></button>
        <button class="gift-hotspot" id="gift-4" type="button" aria-label="Open the rose gift" aria-controls="gift-note"></button>
      </div>
      <section class="gift-note" id="gift-note" aria-labelledby="gift-title" hidden>
        <svg class="icon" aria-hidden="true"><use href="#i-sparkles"/></svg>
        <h2 id="gift-title" tabindex="-1">Congratulations! You found a hidden surprise!</h2>
        <p id="gift-wish"></p>
        <button class="quiet" id="gift-close" type="button">Close</button>
      </section>
      <p id="tree-help" class="sr-only">Drag the tree or press the left and right arrow keys to rotate it. Drag an ornament from the tray, click a branch, or press Enter or Space to hang an ornament.</p>
    </figure>

    <section class="workshop" aria-label="Decorate the tree">
      <fieldset class="customizer">
        <legend>Ornament tray</legend>
        <div class="ornament-tray">
          <button class="ornament-option" type="button" data-ornament-style="random" aria-pressed="true"><svg class="icon" aria-hidden="true"><use href="#i-sparkles"/></svg>Surprise</button>
          <button class="ornament-option" type="button" data-ornament-style="ball" aria-pressed="false"><img class="ornament-thumb" alt="" draggable="false">Glass</button>
          <button class="ornament-option" type="button" data-ornament-style="stripe" aria-pressed="false"><img class="ornament-thumb" alt="" draggable="false">Stripes</button>
          <button class="ornament-option" type="button" data-ornament-style="glitter" aria-pressed="false"><img class="ornament-thumb" alt="" draggable="false">Glitter</button>
          <button class="ornament-option" type="button" data-ornament-style="star" aria-pressed="false"><img class="ornament-thumb" alt="" draggable="false">Star</button>
          <button class="ornament-option" type="button" data-ornament-style="snowflake" aria-pressed="false"><img class="ornament-thumb" alt="" draggable="false">Snow</button>
          <button class="ornament-option" type="button" data-ornament-style="bow" aria-pressed="false"><img class="ornament-thumb" alt="" draggable="false">Bow</button>
          <button class="ornament-option" type="button" data-ornament-style="heart" aria-pressed="false"><img class="ornament-thumb" alt="" draggable="false">Heart</button>
          <button class="ornament-option" type="button" data-ornament-style="bell" aria-pressed="false"><img class="ornament-thumb" alt="" draggable="false">Bell</button>
          <button class="ornament-option" type="button" data-ornament-style="drop" aria-pressed="false"><img class="ornament-thumb" alt="" draggable="false">Drop</button>
          <button class="ornament-option" type="button" data-ornament-style="candy" aria-pressed="false"><img class="ornament-thumb" alt="" draggable="false">Candy</button>
          <button class="ornament-option" type="button" data-ornament-style="gift" aria-pressed="false"><img class="ornament-thumb" alt="" draggable="false">Gift</button>
        </div>
        <div class="color-control">
          <label for="ornament-color">Color</label>
          <select id="ornament-color">
            <option value="random">Random color</option>
            <option value="#d54057">Holiday red</option>

  function colorWithAlpha(hex, alpha) {
    return hex + Math.round(clamp(alpha, 0, 1) * 255).toString(16).padStart(2, "0");
  }

  function sprite(size, paint) {
    const buffer = document.createElement("canvas");
    buffer.width = size;
    buffer.height = size;
    paint(buffer.getContext("2d"), size / 2);
    return buffer;
  }

  function makeGlow(color) {
    return sprite(80, (g, r) => {
      const fade = g.createRadialGradient(r, r, 0, r, r, r);
      fade.addColorStop(0, "#fff8ec");
      fade.addColorStop(.13, color);
      fade.addColorStop(.34, colorWithAlpha(color, .19));
      fade.addColorStop(1, colorWithAlpha(color, 0));
      g.fillStyle = fade;
      g.fillRect(0, 0, r * 2, r * 2);
    });
  }

  function makeGlass(color, style) {
    return sprite(120, (g, center) => {
      const r = 40;
      const cy = 65;
      const glass = g.createRadialGradient(44, 45, 1, 64, 69, 51);
      glass.addColorStop(0, "#fff6e3");
      glass.addColorStop(.20, color);
      glass.addColorStop(.58, color);
      glass.addColorStop(1, "#2f102a");
      g.beginPath();
      g.arc(center, cy, r, 0, TAU);
      g.fillStyle = glass;
      g.fill();
      g.save();
      g.clip();
      if (style === "stripe") {
        g.strokeStyle = "#fff1d5b8";
        g.lineWidth = 1.6;
        for (let ring = -1; ring <= 1; ring++) {
          g.beginPath();
          g.ellipse(center, cy + ring * 9, 45, 13, -.38, 0, TAU);
          g.stroke();
        }
      }
      if (style === "glitter") {
        for (let i = 0; i < 82; i++) {
          const a = i * 2.39996;
          const distance = 38 * Math.sqrt((i + 1) / 82);
          g.fillStyle = i % 3 ? "#ffedbf9c" : "#fff8e9f2";
          g.beginPath();
          g.arc(center + Math.cos(a) * distance, cy + Math.sin(a) * distance, i % 3 ? 1 : 1.7, 0, TAU);
          g.fill();
        }
      }
      g.fillStyle = "#fff6e9a6";
      g.beginPath();
      g.ellipse(45, 47, 8, 3, -.72, 0, TAU);
      g.fill();
      g.restore();
      g.strokeStyle = "#f9d5a3";
      g.lineWidth = 2;
      g.beginPath();
      g.arc(center, 19, 4, Math.PI, TAU);
      g.stroke();
      g.fillStyle = "#e0ae6d";
      g.fillRect(center - 6, 20, 12, 7);
      g.fillStyle = "#fff0ba";
      g.fillRect(center - 3, 20, 2, 7);
    });
  }

  function ornamentFinish(g, color) {
    const gradient = g.createLinearGradient(29, 28, 92, 105);
    gradient.addColorStop(0, "#fff6dd");
    gradient.addColorStop(.24, color);
    gradient.addColorStop(.65, color);
    gradient.addColorStop(1, "#402343");
    return gradient;
  }

  function paintSnowflake(g, color) {
    for (let arm = 0; arm < 6; arm++) {
      g.save();
      g.translate(60, 64);
      g.rotate(arm * TAU / 6);
      g.beginPath();
      g.moveTo(0, 0);
      g.lineTo(0, -41);
      g.moveTo(-13, -28);
      g.lineTo(0, -18);
      g.lineTo(13, -28);
      g.strokeStyle = color;
      g.lineWidth = 8;
      g.stroke();
      g.strokeStyle = "#fff7e3";
      g.lineWidth = 2.5;
      g.stroke();
      g.restore();
    }
  }

  function paintCandy(g, color) {
    g.beginPath();
    g.moveTo(46, 102);
    g.lineTo(58, 43);
    g.bezierCurveTo(64, 9, 102, 15, 95, 44);
    g.strokeStyle = "#fff0db";
    g.lineWidth = 21;
    g.stroke();
    g.strokeStyle = color;
    g.lineWidth = 19;
    g.lineCap = "butt";
    g.setLineDash([8, 9]);
    g.stroke();
  }

  function paintGift(g, finish) {
    g.fillStyle = finish;
    g.fillRect(27, 45, 66, 50);
    g.fillRect(23, 37, 74, 14);
    g.fillStyle = "#ffdc9f";
    g.fillRect(55, 37, 10, 58);
    g.fillRect(27, 63, 66, 8);
    g.beginPath();
    g.moveTo(60, 38);
    g.bezierCurveTo(20, 21, 44, 7, 60, 38);
    g.bezierCurveTo(76, 7, 101, 21, 60, 38);
    g.strokeStyle = "#ffe6ae";
    g.lineWidth = 4;
    g.stroke();
  }

  function makeOrnament(color, style) {
    if (style === "ball" || style === "stripe" || style === "glitter") return makeGlass(color, style);

    return sprite(120, g => {
      const foil = ornamentFinish(g, color);
      g.lineCap = g.lineJoin = "round";
      if (style === "snowflake") return paintSnowflake(g, color);
      if (style === "candy") return paintCandy(g, color);
      if (style === "gift") return paintGift(g, foil);

      g.beginPath();
      if (style === "star") {
        for (let point = 0; point < 10; point++) {
          const a = point * Math.PI / 5 - Math.PI / 2;
          const radius = point % 2 ? 20 : 45;
          const x = 60 + Math.cos(a) * radius;
          const y = 65 + Math.sin(a) * radius;
          if (point === 0) g.moveTo(x, y);
          else g.lineTo(x, y);
        }
      } else if (style === "heart") {
        g.moveTo(60, 105);
        g.bezierCurveTo(44, 89, 12, 69, 21, 48);
        g.bezierCurveTo(28, 29, 47, 34, 60, 48);
        g.bezierCurveTo(81, 24, 99, 33, 102, 51);
        g.bezierCurveTo(108, 71, 78, 94, 60, 105);
      } else if (style === "drop") {
        g.moveTo(60, 23);
        g.bezierCurveTo(66, 45, 95, 60, 88, 84);
        g.bezierCurveTo(80, 112, 40, 112, 32, 84);
        g.bezierCurveTo(25, 60, 54, 45, 60, 23);
      } else if (style === "bell") {
        g.moveTo(23, 87);
        g.quadraticCurveTo(36, 75, 37, 56);
        g.bezierCurveTo(40, 22, 80, 22, 83, 56);
        g.quadraticCurveTo(85, 75, 97, 87);
        g.quadraticCurveTo(60, 100, 23, 87);
      } else if (style === "bow") {
        g.moveTo(58, 58);
        g.bezierCurveTo(21, 14, 9, 31, 19, 62);
        g.bezierCurveTo(22, 77, 46, 70, 55, 63);
        g.lineTo(35, 104);
        g.lineTo(52, 92);
        g.lineTo(62, 102);
        g.lineTo(66, 65);
        g.bezierCurveTo(88, 84, 107, 71, 106, 48);
        g.bezierCurveTo(105, 23, 78, 31, 58, 58);
      }
      g.closePath();
      g.fillStyle = foil;
      g.fill();
      g.strokeStyle = "#fff1c9b5";
      g.lineWidth = 2;
      g.stroke();
      if (style === "bell" || style === "bow") {
        g.beginPath();
        g.arc(60, style === "bell" ? 95 : 58, style === "bell" ? 7 : 9, 0, TAU);
        g.fillStyle = "#f7c984";
        g.fill();
      }
    });
  }

  function makeWishTag(words) {
    return sprite(256, g => {

      g.stroke();

  // A softly scalloped cone keeps the particle silhouette readable as a fir.

  function resize() {
    const rect = canvas.getBoundingClientRect();
    setSceneGeometry(rect.width, rect.height);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (const gift of gifts) {
      const p = project(gift.x, gift.h / 2, gift.z + gift.d / 2, 1, 0);
      gift.button.style.left = p.x + "px";
      gift.button.style.top = p.y + "px";
      gift.button.style.setProperty("--gift-width", (gift.w * p.scale + 5) + "px");
      gift.button.style.setProperty("--gift-height", (gift.h * p.scale + 9) + "px");
    }
  }

  function setSceneGeometry(w, h) {
    width = Math.max(1, w);
    height = Math.max(1, h);
    center = width / 2;
    base = height * .837;
    unit = Math.min(height * .0465, width * .057);
  }

  function project(x, y, z, ca, sa) {
    const depth = x * sa + z * ca;
    const scale = CAMERA / (CAMERA - depth) * unit;
    return { x: center + (x * ca - z * sa) * scale, y: base - 6.5 * unit - (y - 6.5) * scale, z: depth, scale };
  }

  function drawSprite(image, x, y, size, alpha = 1) {
    ctx.globalAlpha = alpha;
    ctx.drawImage(image, x - size / 2, y - size / 2, size, size);
  }

  function drawBackdrop(t) {
    const palette = assets.palette;
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
    const sky = ctx.createRadialGradient(center, height * .43, 0, center, height * .44, Math.max(width, height) * .72);
    sky.addColorStop(0, palette.backdrop[0]);
    sky.addColorStop(.47, palette.backdrop[1]);
    sky.addColorStop(1, palette.backdrop[2]);
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, width, height);

    if (backdropArt.naturalWidth) {
      // Preserve the decorated edges in narrow layouts and in the portrait card.
      const frameWidth = Math.max(width, height * .94);
      ctx.globalAlpha = state.theme === "frost" ? .58 : .88;
      ctx.drawImage(backdropArt, (width - frameWidth) / 2, 0, frameWidth, height);
      const tint = ctx.createRadialGradient(center, height * .53, 0, center, height * .53, width * .46);
      tint.addColorStop(0, colorWithAlpha(palette.backdrop[0], state.theme === "classic" ? .39 : .73));
      tint.addColorStop(1, colorWithAlpha(palette.backdrop[0], 0));
      ctx.globalAlpha = 1;
      ctx.fillStyle = tint;
      ctx.fillRect(0, 0, width, height);
    }

    ctx.save();
    ctx.translate(center, 0);
    ctx.scale(1, .5);
    const lightRadius = Math.max(width * .5, height * .89);
    const canopyLight = ctx.createRadialGradient(0, -height * .36, 0, 0, -height * .36, lightRadius);
    canopyLight.addColorStop(0, colorWithAlpha(palette.glow, .35));
    canopyLight.addColorStop(1, colorWithAlpha(palette.glow, 0));
    ctx.fillStyle = canopyLight;
    ctx.fillRect(-width / 2, 0, width, height * 2);
    ctx.restore();

    ctx.globalCompositeOperation = "lighter";
    const scale = clamp(width / 760, .58, 1.75);
    for (const orb of bokeh) {
      const pulse = .45 + .55 * (.5 + .5 * Math.sin(t * .52 + orb.phase));
      drawSprite(assets.halo, orb.x * width, orb.y * height, orb.size * scale * 1.85, .16 * pulse);
    }
    ctx.lineWidth = .75 * scale;
    ctx.strokeStyle = palette.ribbon[3];
    for (const star of shimmer) {
      const x = star.x * width;
      const y = star.y * height;
      const r = star.size * scale * .36;
      const pulse = .5 + .5 * Math.sin(t * .78 + star.phase);
      ctx.globalAlpha = .09 + .37 * pulse * pulse;
      ctx.beginPath();
      ctx.moveTo(x - r, y);
      ctx.lineTo(x + r, y);
      ctx.moveTo(x, y - r * 1.55);
      ctx.lineTo(x, y + r * 1.55);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }

  function drawAtmosphere(t) {
    const palette = assets.palette;
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
    ctx.strokeStyle = "#fbcf9f27";
    ctx.lineWidth = 1;
    const radius = Math.min(width * .39, height * .415);
    const gap = Math.max(6, width * .014);
    for (const offset of [0, gap, gap * 1.65]) {
      ctx.beginPath();
      ctx.arc(center, height * .47, radius + offset, Math.PI * 1.04, Math.PI * 1.96);
      ctx.stroke();
    }
    for (let i = 1; i <= 21; i++) {
      const a = Math.PI * (1.04 + .92 * i / 22);
      const r = radius + gap;
      const x = center + Math.cos(a) * r;
      const y = height * .47 + Math.sin(a) * r;
      const size = (i % 5 === 1) ? 3.25 : 1.4;
      polygon([{ x, y: y - size }, { x: x + size, y }, { x, y: y + size }, { x: x - size, y }], "#f6cd9585");
    }
    ctx.fillStyle = "#ffe1b1";
    for (const star of twinkles) {
      const x = star.x * width;
      const y = star.y * height;
      ctx.globalAlpha = .17 + .26 * (.5 + .5 * Math.sin(t + star.phase));
      ctx.fillRect(x, y, star.size, star.size);
    }
    ctx.globalAlpha = 1;
    ctx.save();
    ctx.translate(center, base + 2);
    ctx.scale(1, .24);
    const radiusGround = Math.min(width * .49, unit * 10.7);
    const pool = ctx.createRadialGradient(0, 0, 0, 0, 0, radiusGround);
    pool.addColorStop(0, colorWithAlpha(palette.glow, .33));
    pool.addColorStop(.42, colorWithAlpha(palette.glow, .13));
    pool.addColorStop(1, colorWithAlpha(palette.glow, 0));
    ctx.fillStyle = pool;
    ctx.fillRect(-radiusGround, -radiusGround, radiusGround * 2, radiusGround * 2);
    ctx.restore();

    for (let i = 0; i < 3; i++) {
      ctx.strokeStyle = colorWithAlpha(palette.glow, .18 - i * .04);
      ctx.beginPath();
      ctx.ellipse(center, base + 1, unit * (6.9 + i * .85), unit * (1.06 + i * .23), 0, 0, TAU);
      ctx.stroke();
    }
  }

  function drawSnow(t, foreground) {
    if (!state.snow) return;
    ctx.fillStyle = "#fff4e5";
    for (const flake of snow) {
      if (flake.near !== foreground) continue;
      const x = (flake.x * width + Math.sin(t * .45 + flake.phase) * 23 + width) % width;
      const y = ((flake.y + flake.speed * t) % 1) * height;
      if (foreground && flake.size > 1.8) drawSprite(assets.halo, x, y, 20, .29);
      ctx.globalAlpha = foreground ? .61 : .29;
      ctx.beginPath();
      ctx.arc(x, y, flake.size * (foreground ? 1 : .71), 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawRibbonSegment(before, after, index) {
    const palette = assets.palette.ribbon;
    const fromWidth = unit * (.13 + .12 * (1 - ribbon[index - 1].t));
    const toWidth = unit * (.13 + .12 * (1 - ribbon[index].t));
    const face = (before.z + after.z) / 2 > 0;
    ctx.globalAlpha = face ? .98 : .52;
    const foil = ctx.createLinearGradient(0, before.y - fromWidth, 0, before.y + fromWidth);
    foil.addColorStop(0, palette[3]);
    foil.addColorStop(.20, palette[2]);
    foil.addColorStop(.56, palette[1]);
    foil.addColorStop(.92, palette[0]);
    foil.addColorStop(1, palette[2]);
    polygon([
      { x: before.x, y: before.y - fromWidth },
      { x: after.x, y: after.y - toWidth },
      { x: after.x, y: after.y + toWidth },
      { x: before.x, y: before.y + fromWidth }
    ], foil);

    if (face && index % 4 === 0) {
      ctx.fillStyle = palette[3];
      ctx.globalAlpha = .67;
      ctx.fillRect(after.x, after.y - toWidth * .74, 1.2, 1.2);
    }
  }

  function ballPosition(ball, ca, sa) {
    const radius = canopy(ball.t) + (ball.tag ? .37 : .13);
    return project(Math.cos(ball.a) * radius, .49 + ball.t * 13.3, Math.sin(ball.a) * radius, ca, sa);
  }

  function drawTree(t, now) {
    const ca = Math.cos(angle);
    const sa = Math.sin(angle);
    const layers = Array.from({ length: 17 }, () => ({ needles: [], ribbon: [], lights: [], ornaments: [] }));
    const layer = z => layers[clamp(Math.floor(z + 8), 0, layers.length - 1)];
    const shades = assets.palette.foliage;

    for (const leaf of needles) {
      const p = project(leaf.x, leaf.y, leaf.z, ca, sa);
      layer(p.z).needles.push([p, leaf]);
    }
    for (const lamp of lamps) {
      const p = project(lamp.x, lamp.y, lamp.z, ca, sa);
      layer(p.z).lights.push([p, lamp]);
    }
    for (const ball of builtIn.concat(ornaments, wishes)) {
      const p = ballPosition(ball, ca, sa);
      if (ball.tag && p.z < .22) continue;
      layer(p.z).ornaments.push([p, ball]);
    }
    let previous = project(ribbon[0].x, ribbon[0].y, ribbon[0].z, ca, sa);
    for (let i = 1; i < ribbon.length; i++) {
      const segment = ribbon[i];
      const p = project(segment.x, segment.y, segment.z, ca, sa);
      layer((p.z + previous.z) / 2).ribbon.push([previous, p, i]);
      previous = p;
    }

    for (const group of layers) {
      ctx.globalCompositeOperation = "source-over";
      for (const [p, leaf] of group.needles) {
        const size = leaf.size * p.scale * .045;
        ctx.globalAlpha = .45 + .30 * clamp((p.z + 5) / 12, 0, 1);
        ctx.fillStyle = shades[leaf.tone];
        ctx.fillRect(p.x - size, p.y, size * 2.25, Math.max(.65, size * .67));
      }
      for (const [p, next, i] of group.ribbon) drawRibbonSegment(p, next, i);

      ctx.globalCompositeOperation = "lighter";
      for (const [p, lamp] of group.lights) {
        const twinkle = .5 + .5 * Math.sin(t * 3.6 + lamp.phase);
        const wave = .5 + .5 * Math.sin(t * 2.7 - lamp.t * 20);
        const tipFade = 1 - .45 * clamp((lamp.t - .89) / .11, 0, 1);
        const size = lamp.size * p.scale * .12 * (.86 + .46 * twinkle + .25 * wave) * tipFade;
        const glow = state.lights ? (.34 + .41 * twinkle + .19 * wave) : .065;
        drawSprite(assets.lights[lamp.color], p.x, p.y, size, glow * (.6 + .4 * clamp((p.z + 5) / 10, 0, 1)));
      }

      ctx.globalCompositeOperation = "source-over";
      for (const [p, ball] of group.ornaments) {
        if (ball.tag) {
          drawSprite(ball.tag, p.x, p.y, ball.size * p.scale, clamp((p.z - .22) / .8, 0, 1));
          continue;
        }
        const age = (now - ball.placed) / 1000;
        const bounce = age < .5 && !motion.matches ? 1 + Math.sin(age / .5 * Math.PI) * .38 : 1;
        const size = ball.size * p.scale * 1.46 * bounce;
        const alpha = .58 + .42 * clamp((p.z + 5) / 10, 0, 1);
        if (state.lights && ball.size > .58) drawSprite(assets.halo, p.x, p.y, size * 1.7, alpha * .27);
        drawSprite(ball.art?.image ?? assets.ornaments[ball.color], p.x, p.y, size, alpha);
      }
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
    drawGifts(now);
    drawTopper(t);
  }

  function polygon(points, fill) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for (const point of points.slice(1)) ctx.lineTo(point.x, point.y);
    ctx.closePath();
    ctx.fill();
  }

  function drawGifts(now) {
    for (const gift of gifts) {
      const at = (x, y, z) => project(gift.x + x, y, gift.z + z, 1, 0);
      const front = gift.d / 2;
      const back = -front;
      const left = -gift.w / 2;
      const right = -left;
      const top = gift.h;
      const seam = .11;
      const gold = assets.palette.ribbon;
      const age = gift.openedAt === undefined ? 0 : (now - gift.openedAt) / 1000;
      const open = gift.openedAt === undefined ? 0 : (motion.matches ? 1 : ease(0, .65, age));
      polygon([at(left, 0, front), at(right, 0, front), at(right, top, front), at(left, top, front)], gift.color);
      polygon([at(right, 0, front), at(right, 0, back), at(right, top, back), at(right, top, front)], gift.side);
      polygon([at(-seam, 0, front), at(seam, 0, front), at(seam, top, front), at(-seam, top, front)], gold[2]);

      if (open > 0) {
        polygon([at(left, top, front), at(right, top, front), at(right, top, back), at(left, top, back)], gold[1]);
        polygon([at(left + .08, top, front - .08), at(right - .08, top, front - .08),
          at(right - .08, top, back + .08), at(left + .08, top, back + .08)], "#481b2b");
        const light = at(0, top + .12, 0);
        ctx.globalCompositeOperation = "lighter";
        drawSprite(assets.halo, light.x, light.y, light.scale * 4.2, .53 * open);
        if (age < 1.15 && !motion.matches) {
          for (let i = 0; i < 18; i++) {
            const a = i * 2.39996;
            const travel = Math.sqrt(Math.max(age, 0)) * light.scale * (1.2 + i % 5 * .24);
            drawSprite(assets.lights[i % 4], light.x + Math.cos(a) * travel, light.y + Math.sin(a) * travel * .48 - travel * .8,
              Math.max(2, light.scale * .49 * (1 - age / 1.15)), (1 - age / 1.15) * .95);
          }
        }
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
      }
      const lid = (x, z) => at(x + Math.sign(gift.x) * open * .38, top + open * (.95 + x * .28), z - open * .24);
      polygon([lid(left, front), lid(right, front), lid(right, back), lid(left, back)], gift.top);
      polygon([lid(-seam, front), lid(seam, front), lid(seam, back), lid(-seam, back)], gold[3]);
      polygon([lid(left, -seam), lid(right, -seam), lid(right, seam), lid(left, seam)], gold[3]);
      const bow = lid(0, 0);
      const size = bow.scale * .34;
      ctx.strokeStyle = gold[2];
      ctx.lineWidth = Math.max(1.1, size * .22);
      ctx.beginPath();
      ctx.moveTo(bow.x, bow.y);
      ctx.bezierCurveTo(bow.x - size * 2.7, bow.y - size * .8, bow.x - size, bow.y - size * 2, bow.x, bow.y);
      ctx.bezierCurveTo(bow.x + size, bow.y - size * 2, bow.x + size * 2.7, bow.y - size * .8, bow.x, bow.y);
      ctx.stroke();
    }
  }

  function hideGiftNote(restoreFocus = false) {
    clearTimeout(giftTimer);
    giftNote.hidden = true;
    if (activeGift) {
      activeGift.button.setAttribute("aria-expanded", "false");
      if (restoreFocus) activeGift.button.focus();
    }
    activeGift = undefined;
  }

  function openGift(gift) {
    hideGiftNote();
    activeGift = gift;
    const firstOpening = gift.openedAt === undefined;
    gift.openedAt ??= performance.now();
    gift.button.title = "Read this gift’s surprise";
    const showMessage = () => {
      if (activeGift !== gift) return;
      const wish = byId("gift-wish");
      wish.lang = gift.lang ?? "en";
      wish.textContent = gift.wish;
      giftNote.hidden = false;
      gift.button.setAttribute("aria-expanded", "true");
      if (document.activeElement === gift.button) byId("gift-title").focus({ preventScroll: true });
      byId("announcement").textContent = "Congratulations! You found a hidden surprise! " + gift.wish;
    };
    if (firstOpening && !motion.matches) giftTimer = setTimeout(showMessage, 680);
    else showMessage();
  }

  function drawTopper(t) {
    const p = project(0, 14.68, 0, 1, 0);
    const r = unit * .93;
    const pulse = .76 + .24 * Math.sin(t * 2);
    const palette = assets.palette.ribbon;
    ctx.globalCompositeOperation = "lighter";
    if (state.lights) {
      drawSprite(assets.halo, p.x, p.y, unit * 9.5, .46 + pulse * .18);
      drawSprite(assets.halo, p.x, p.y, unit * 4.4, .64);
      ctx.globalAlpha = .49;
      ctx.strokeStyle = palette[3];
      ctx.lineWidth = .7;
      for (let i = 0; i < 4; i++) {
        const a = i * Math.PI / 4;
        const length = r * (i % 2 ? 1.8 : 2.55);
        const dx = Math.cos(a) * length;
        const dy = Math.sin(a) * length;
        const ray = ctx.createLinearGradient(p.x - dx, p.y - dy, p.x + dx, p.y + dy);
        ray.addColorStop(0, colorWithAlpha(palette[2], 0));
        ray.addColorStop(.5, palette[3]);
        ray.addColorStop(1, colorWithAlpha(palette[2], 0));
        ctx.strokeStyle = ray;
        ctx.beginPath();
        ctx.moveTo(p.x - dx, p.y - dy);
        ctx.lineTo(p.x + dx, p.y + dy);
        ctx.stroke();
      }
    }
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
    const points = Array.from({ length: 10 }, (_, i) => {
      const a = i * Math.PI / 5 - Math.PI / 2;
      const radius = i % 2 ? r * .41 : r;
      return { x: p.x + Math.cos(a) * radius, y: p.y + Math.sin(a) * radius };
    });
    for (let i = 0; i < points.length; i++) {
      polygon([p, points[i], points[(i + 1) % points.length]], palette[i % 2 ? 2 : 3]);
    }
    ctx.strokeStyle = palette[3];
    ctx.lineWidth = .8;
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for (const point of points.slice(1)) ctx.lineTo(point.x, point.y);
    ctx.closePath();
    ctx.stroke();
  }

  function drawBursts(now) {
    ctx.globalCompositeOperation = "lighter";
    const cos = Math.cos(angle);
    const sin = Math.sin(angle);
    bursts = bursts.filter(burst => now - burst.placed < 850);
    for (const ball of bursts) {
      const progress = (now - ball.placed) / 850;
      const p = ballPosition(ball, cos, sin);
      for (let i = 0; i < 14; i++) {
        const a = i * TAU / 14;
        const distance = 9 + progress * (23 + 21 * (i % 3));
        drawSprite(assets.lights[i % 4], p.x + Math.cos(a) * distance, p.y + Math.sin(a) * distance, 13 - 8 * progress, (1 - progress) * .86);
      }
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }

  function startIntro() {
    hideGiftNote();
    introStarted = performance.now();
    introLabel.textContent = "Skip fireworks";
    giftLayer.hidden = true;
  }

  function finishIntro() {
    if (introStarted !== undefined) idleUntil = 0;
    introStarted = undefined;
    introLabel.textContent = "Replay fireworks";
    giftLayer.hidden = false;
  }

  function drawFireworks(elapsed) {
    const hubY = height * .445;
    const span = Math.min(width, height);
    const ca = Math.cos(angle);
    const sa = Math.sin(angle);
    ctx.globalCompositeOperation = "lighter";

    if (elapsed < .50) {
      for (let i = 23; i >= 0; i--) {
        const p = clamp((elapsed - i * .012) / .50, 0, 1);
        const x = center - span * .13 * (1 - p) + Math.sin(p * Math.PI) * span * .057;
        const y = mix(height * .91, hubY, 1 - (1 - p) ** 1.26);
        drawSprite(assets.lights[1], x, y, 28 - i * .83, (1 - i / 24) * .94);
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
      return;
    }

    const age = elapsed - .50;
    const blast = 1 - (1 - clamp(age / .98, 0, 1)) ** 2;
    const core = .73 * (1 - ease(0, .55, age));
    if (core > 0) {
      drawSprite(assets.halo, center, hubY, span * (.15 + blast * .37), core);
      ctx.strokeStyle = assets.palette.ribbon[2];
      ctx.globalAlpha = .42 * (1 - ease(0, .57, age));
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.arc(center, hubY, span * Math.max(.01, blast * .36), 0, TAU);
      ctx.stroke();
    }

    for (const spark of firework) {
      const target = project(spark.target.x, spark.target.y, spark.target.z, ca, sa);
      const join = ease(.54 + spark.delay, 1.90 + spark.delay, age);
      const distance = span * spark.distance * blast;
      const swirl = Math.sin(spark.phase + join * Math.PI * 2) * span * .12 * join * (1 - join);
      const x = mix(center + spark.dx * distance, target.x, join) + swirl;
      const y = mix(hubY + spark.dy * distance * .83 + span * .061 * age ** 2, target.y, join);
      const opacity = (1 - ease(2.18, introDuration, elapsed)) * (.58 + .42 * Math.sin(age * 11 + spark.phase) ** 2);
      if (join < .72 && spark.distance > .17) {
        const tail = span * .062 * blast * (1 - join) * (spark.distance * 2);
        ctx.globalAlpha = opacity * .54;
        ctx.strokeStyle = assets.palette.lamps[spark.color];
        ctx.lineWidth = spark.size * .13;
        ctx.beginPath();
        ctx.moveTo(x - spark.dx * tail, y - spark.dy * tail * .8);
        ctx.lineTo(x, y);
        ctx.stroke();
      }
      drawSprite(assets.lights[spark.color], x, y, spark.size * (1.64 - .51 * join), opacity);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }

  function drawRevealedTree(now, opacity) {
    revealLayer ??= document.createElement("canvas");
    if (revealLayer.width !== canvas.width || revealLayer.height !== canvas.height) {
      revealLayer.width = canvas.width;
      revealLayer.height = canvas.height;
    }
    const liveContext = ctx;
    try {
      ctx = revealLayer.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, width, height);
      drawTree(time, now);
    } finally {
      ctx = liveContext;
    }
    ctx.globalAlpha = opacity;
    ctx.drawImage(revealLayer, 0, 0, width, height);
    ctx.globalAlpha = 1;
  }

  function frame(now) {
    const dt = lastFrame ? Math.min((now - lastFrame) / 1000, .045) : 0;
    lastFrame = now;
    const elapsed = introStarted === undefined ? introDuration : Math.max(0, (now - introStarted) / 1000);
    if (introStarted !== undefined && elapsed >= introDuration) finishIntro();
    if (!motion.matches || state.snow || state.rotate) time += dt;
    if (state.rotate && introStarted === undefined && !pointer && !decorationDrag?.item && now > idleUntil) {
      angle = (angle + dt * .23) % TAU;
    }
    if (decorationDrag?.item) {
      const y = decorationDrag.y;
      const edge = 52;
      if (y < edge) window.scrollBy(0, -dt * (edge - y) * 8);
      if (y > window.innerHeight - edge) window.scrollBy(0, dt * (y - window.innerHeight + edge) * 8);
    }
    drawBackdrop(time);
    if (elapsed >= introDuration) {
      drawTreeView(now);
    } else {
      drawAtmosphere(time);
      drawSnow(time, false);
      const opacity = ease(1.55, 2.71, elapsed);
      if (opacity > 0) drawRevealedTree(now, opacity);
      drawFireworks(elapsed);
      drawSnow(time, true);
    }
    drawBursts(now);
    requestAnimationFrame(frame);
  }

  function drawTreeView(now) {
    drawAtmosphere(time);
    drawSnow(time, false);
    drawTree(time, now);
    drawSnow(time, true);
  }

  function updateCount(message) {
    byId("count").textContent = ornaments.length;
    byId("announcement").textContent = message;
  }

  function chooseOrnament(preference = selectedStyle) {
    const style = preference === "random" ? styles[Math.floor(random(0, styles.length))] : preference;
    let color = colorPicker.value;
    if (color === "random") {
      const options = [...assets.palette.glass, ornamentStyles[style][1], ...surpriseColors];
      color = options[Math.floor(random(0, options.length))];
    }
    if (color === "custom") color = customColor.value;
    return { style, size: random(.83, 1.08), art: ornamentArt(style, color) };
  }

  function addOrnament(t, a, decoration = chooseOrnament()) {
    if (introStarted !== undefined) finishIntro();
    const ball = { ...decoration, t, a, placed: performance.now() };
    ornaments.push(ball);
    if (!motion.matches) bursts.push(ball);
    updateCount("Hung " + ornamentStyles[ball.style][0] + ". Ornaments on the tree: " + ornaments.length + ".");
    if (musicOutput && audio?.state === "running") note(84, audio.currentTime + .02, .26, .045, musicOutput);
  }

  function hangRandom() {
    const recent = ornaments.slice(-65);
    let placement;
    for (let attempt = 0; attempt < 12; attempt++) {
      const t = .05 + .89 * (1 - Math.random() ** 1.32);
      const a = random(.21, Math.PI - .21) - angle;
      placement = { t, a };
      if (!recent.some(other => {
        const vertical = 13.3 * (other.t - t);
        const horizontal = 2 * canopy(t) * Math.sin((other.a - a) / 2);
        return vertical ** 2 + horizontal ** 2 < .75;
      })) break;
    }
    addOrnament(placement.t, placement.a);
  }

  function hangAt(x, y, decoration) {
    // Search the visible half of the same surface used to draw each bauble.
    let nearest;
    let min = Infinity;
    const ca = Math.cos(angle);
    const sa = Math.sin(angle);
    for (let row = 0; row <= 44; row++) {
      const t = .035 + .91 * row / 44;
      for (let column = 0; column <= 38; column++) {
        const a = .07 + (Math.PI - .14) * column / 38 - angle;
        const p = ballPosition({ t, a }, ca, sa);
        const distance = (x - p.x) ** 2 + (y - p.y) ** 2;
        if (distance < min) {
          min = distance;
          nearest = { t, a };
        }
      }
    }
    if (min >= Math.max(11, unit * .55) ** 2) return false;
    addOrnament(nearest.t, nearest.a, decoration);
    return true;
  }

  function trackDecoration(event) {
    const drag = decorationDrag;
    if (drag?.id !== event.pointerId) return;
    const distance = Math.hypot(event.clientX - drag.x, event.clientY - drag.startY);
    if (!drag.item && distance < 7) return;
    if (!drag.item) {
      drag.item = chooseOrnament(drag.style);
      dragImage.src = ornamentThumbnail(drag.item.art);
      dragImage.hidden = false;
      scene.dataset.dropActive = "true";
      sceneHint.textContent = "Release over a branch";
    }
    drag.y = event.clientY;
    dragImage.style.transform = "translate(" + (event.clientX - 31) + "px," + (event.clientY - 31) + "px)";
  }

  function clearDecorationDrag() {
    decorationDrag = undefined;
    dragImage.hidden = true;
    delete scene.dataset.dropActive;
    sceneHint.textContent = "Click to hang · Drag to spin";
  }

  function dropDecoration(event) {
    const drag = decorationDrag;
    if (drag?.id !== event.pointerId) return;
    if (drag.item) {
      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      if (x <= 0 || x >= rect.width || y <= 0 || y >= rect.height || !hangAt(x, y, drag.item)) {
        byId("announcement").textContent = "Release the ornament over a branch to hang it.";
      }
    }
    clearDecorationDrag();
  }

  for (const button of styleButtons) {
    const style = button.dataset.ornamentStyle;
    button.addEventListener("click", () => {
      selectedStyle = style;
      refreshTray();
    });
    button.addEventListener("pointerdown", event => {
      if (decorationDrag || event.button !== 0) return;
      decorationDrag = { id: event.pointerId, x: event.clientX, startY: event.clientY, style };
      button.setPointerCapture(event.pointerId);
    });
    button.addEventListener("pointermove", trackDecoration);
    button.addEventListener("pointerup", dropDecoration);
    button.addEventListener("lostpointercapture", event => {
      if (decorationDrag?.id === event.pointerId) clearDecorationDrag();
    });
  }
  colorPicker.addEventListener("change", refreshTray);
  customColor.addEventListener("change", refreshTray);

  canvas.addEventListener("pointerdown", event => {
    if (pointer || event.button !== 0) return;
    if (introStarted !== undefined) finishIntro();
    pointer = { id: event.pointerId, start: event.clientX, y: event.clientY, angle, dragged: false };
    canvas.setPointerCapture(event.pointerId);
  });
  canvas.addEventListener("pointermove", event => {
    if (pointer?.id !== event.pointerId) return;
    const dx = event.clientX - pointer.start;
    if (Math.abs(dx) < 5 && !pointer.dragged) return;
    pointer.dragged = true;
    canvas.classList.add("dragging");
    angle = pointer.angle + dx * .011;
  });
  canvas.addEventListener("pointerup", event => {
    if (pointer?.id !== event.pointerId) return;
    const rect = canvas.getBoundingClientRect();
    if (!pointer.dragged && Math.abs(event.clientY - pointer.y) < 8) {
      hangAt(event.clientX - rect.left, event.clientY - rect.top);
    } else {
      idleUntil = performance.now() + 2200;
    }
    pointer = undefined;
    canvas.classList.remove("dragging");
  });
  canvas.addEventListener("lostpointercapture", () => {
    pointer = undefined;
    canvas.classList.remove("dragging");
  });
  canvas.addEventListener("keydown", event => {
    if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
      event.preventDefault();
      angle += event.key === "ArrowLeft" ? -.23 : .23;
      idleUntil = performance.now() + 2200;
    } else if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      if (!event.repeat) hangRandom();
    }
  });

  const melody = [
    [76,1],[76,1],[76,2],[76,1],[76,1],[76,2],[76,1],[79,1],[72,1.5],[74,.5],[76,3],[0,1],
    [77,1],[77,1],[77,1.5],[77,.5],[77,1],[76,1],[76,1],[76,.5],[76,.5],[76,1],[74,1],[74,1],[76,1],[74,2],[79,2],
    [76,1],[76,1],[76,2],[76,1],[76,1],[76,2],[76,1],[79,1],[72,1.5],[74,.5],[76,3],[0,1],
    [77,1],[77,1],[77,1.5],[77,.5],[77,1],[76,1],[76,1],[76,.5],[76,.5],[79,1],[79,1],[77,1],[74,1],[72,3],[0,3]
  ];

  function note(midi, at, duration, volume, output) {
    const pitch = 440 * 2 ** ((midi - 69) / 12);
    const envelope = audio.createGain();
    envelope.gain.setValueAtTime(.0001, at);
    envelope.gain.exponentialRampToValueAtTime(volume, at + .018);
    envelope.gain.exponentialRampToValueAtTime(.0001, at + duration + .27);
    envelope.connect(output);
    const bell = audio.createOscillator();
    bell.type = "sine";
    bell.frequency.value = pitch;
    bell.connect(envelope);
    bell.start(at);
    bell.stop(at + duration + .3);
    bell.onended = () => envelope.disconnect();
  }

  function stopMusic() {
    soundVersion++;
    clearInterval(musicTimer);
    if (musicOutput) {
      const output = musicOutput;
      output.gain.setTargetAtTime(0, audio.currentTime, .035);
      setTimeout(() => output.disconnect(), 180);
      musicOutput = undefined;
    }
    state.sound = false;
    setPressed(byId("sound"), false);
  }

  async function toggleMusic() {
    if (state.sound) {
      stopMusic();
      return;
    }
    const version = ++soundVersion;
    state.sound = true;
    setPressed(byId("sound"), true);
    try {
      const Audio = window.AudioContext || window.webkitAudioContext;
      audio ??= new Audio();
      await audio.resume();
      if (version !== soundVersion) return;
      musicOutput = audio.createGain();
      musicOutput.gain.value = .55;
      musicOutput.connect(audio.destination);
      let next = audio.currentTime + .04;
      let index = 0;
      let beat = 0;
      const tempo = .29;
      function schedule() {
        if (audio.state !== "running") return;
        if (next < audio.currentTime) next = audio.currentTime + .02;
        while (next < audio.currentTime + .24) {
          const [pitch, beats] = melody[index];
          if (pitch) note(pitch, next, beats * tempo * .78, .105, musicOutput);
          if (beat % 4 === 0) note([48, 55, 53, 55][Math.floor(beat / 4) % 4], next, 1.1, .052, musicOutput);
          next += beats * tempo;
          beat += beats;
          index = (index + 1) % melody.length;
        }
      }
      schedule();
      musicTimer = setInterval(schedule, 86);
    } catch {
      if (version !== soundVersion) return;
      stopMusic();
      byId("announcement").textContent = "This browser could not play the music.";
    }
  }

  function captureCardArtwork() {
    const artwork = document.createElement("canvas");
    artwork.width = cardPreview.width;
    artwork.height = cardPreview.height;
    const liveContext = ctx;
    const liveWidth = width;
    const liveHeight = height;

    try {
      ctx = artwork.getContext("2d");
      setSceneGeometry(artwork.width, artwork.height);
      drawBackdrop(time);
      ctx.save();
      ctx.translate(0, 248);
      setSceneGeometry(artwork.width, 1110);
      drawTreeView(performance.now() + 1000);
      ctx.restore();
      paintCardBorder(artwork.width, artwork.height);
    } finally {
      ctx = liveContext;
      setSceneGeometry(liveWidth, liveHeight);
    }
    return artwork;
  }

  function paintCardBorder(w, h) {
    const foil = assets.palette.ribbon[3];
    ctx.strokeStyle = colorWithAlpha(foil, .70);
    ctx.lineWidth = 2;
    ctx.strokeRect(37, 37, w - 74, h - 74);
    ctx.strokeStyle = colorWithAlpha(foil, .32);
    ctx.strokeRect(49, 49, w - 98, h - 98);
    for (const [x, y, sx, sy] of [[37, 37, 1, 1], [w - 37, 37, -1, 1], [37, h - 37, 1, -1], [w - 37, h - 37, -1, -1]]) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(sx, sy);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = foil;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(54, 0);
      ctx.lineTo(0, 0);
      ctx.lineTo(0, 54);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawCardPreview() {
    const output = cardPreview.getContext("2d");
    const centerX = cardPreview.width / 2;
    const foil = assets.palette.ribbon[3];
    output.drawImage(cardArtwork, 0, 0);
    output.textAlign = "center";
    output.textBaseline = "middle";
    output.fillStyle = foil;
    output.font = "22px Georgia, serif";
    output.fillText("C H R I S T M A S   W O R K S H O P", centerX, 109);
    output.fillStyle = "#fff1e4";
    output.font = "italic bold 88px Georgia, serif";
    output.fillText("Merry Christmas", centerX, 191, 1010);
    output.fillStyle = foil;
    output.font = 'italic 30px Georgia, serif';
    output.fillText("Warmest Wishes", centerX, 1271);
    output.strokeStyle = colorWithAlpha(foil, .64);
    output.lineWidth = 1.5;
    output.beginPath();
    output.moveTo(centerX - 60, 1315);
    output.lineTo(centerX + 60, 1315);
    output.stroke();
    output.fillStyle = "#fff1e4";
    output.font = "34px Georgia, serif";
    output.fillText(cardMessage.value.trim(), centerX, 1362, cardPreview.width - 172);
    output.fillStyle = foil;
    output.font = "italic 32px Georgia, serif";
    output.fillText(cardMessageDetail.value.trim(), centerX, 1410, cardPreview.width - 172);
    prepareCardDownload();
  }

  function releaseCardUrl() {
    if (cardUrl) URL.revokeObjectURL(cardUrl);
    cardUrl = undefined;
    cardDownload.setAttribute("href", "#");
    cardDownload.setAttribute("aria-disabled", "true");
  }

  function prepareCardDownload() {
    const version = ++exportVersion;
    cardDownload.setAttribute("aria-disabled", "true");
    cardStatus.textContent = "Preparing PNG…";
    cardPreview.toBlob(blob => {
      if (version !== exportVersion) return;
      releaseCardUrl();
      if (!blob) {
        cardStatus.textContent = "Could not create the PNG. Try reopening the card.";
        return;
      }
      cardUrl = URL.createObjectURL(blob);
      cardDownload.href = cardUrl;
      cardDownload.removeAttribute("aria-disabled");
      cardStatus.textContent = "1200 × 1500 px";
    }, "image/png");
  }

  function openCard() {
    cardArtwork = captureCardArtwork();
    drawCardPreview();
    cardDialog.showModal();
  }

  byId("save-card").addEventListener("click", openCard);
  cardMessage.addEventListener("input", drawCardPreview);
  cardMessageDetail.addEventListener("input", drawCardPreview);
  cardDialog.addEventListener("close", () => {
    cardArtwork = undefined;
    exportVersion++;
    releaseCardUrl();
  });
  cardDownload.addEventListener("click", event => {
    if (cardDownload.getAttribute("aria-disabled") === "true") event.preventDefault();
  });

  function reset() {
    stopMusic();
    finishIntro();
    hideGiftNote();
    for (const gift of gifts) {
      gift.openedAt = undefined;
      gift.button.removeAttribute("title");
    }
    angle = -.26;
    idleUntil = 0;
    ornaments = [];
    bursts = [];
    selectedStyle = "random";
    colorPicker.value = "random";
    customColor.value = "#e7a44e";
    ornamentCache.clear();
    refreshTray();
    state.lights = true;
    state.snow = !motion.matches;
    state.rotate = !motion.matches;
    for (const key of ["lights", "snow", "rotate"]) setPressed(byId(key), state[key]);
    loadTheme("classic");
    updateCount("The Christmas tree has been reset.");
  }

  byId("sound").addEventListener("click", toggleMusic);
  byId("reset").addEventListener("click", reset);
  byId("intro-action").addEventListener("click", () => {
    if (introStarted === undefined) startIntro();
    else finishIntro();
  });
  for (const gift of gifts) {
    gift.button.addEventListener("click", () => openGift(gift));
  }
  byId("gift-close").addEventListener("click", () => hideGiftNote(true));
  giftNote.addEventListener("keydown", event => {
    if (event.key === "Escape") hideGiftNote(true);
  });
  hang.addEventListener("click", hangRandom);
  themeButtons.forEach(button => button.addEventListener("click", () => loadTheme(button.dataset.themeKey)));
  for (const key of ["lights", "snow", "rotate"]) {
    const button = byId(key);
    button.addEventListener("click", () => {
      state[key] = !state[key];
      if (key === "rotate") idleUntil = 0;
      setPressed(button, state[key]);
    });
  }
  motion.addEventListener("change", event => {
    if (!event.matches) return;
    if (introStarted !== undefined) finishIntro();
    state.snow = false;
    state.rotate = false;
    bursts = [];
    setPressed(byId("snow"), false);
    setPressed(byId("rotate"), false);
  });

  loadTheme("classic");
  refreshTray();
  setPressed(byId("snow"), state.snow);
  setPressed(byId("rotate"), state.rotate);
  new ResizeObserver(resize).observe(canvas);
  resize();
  if (motion.matches) finishIntro();
  else startIntro();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
