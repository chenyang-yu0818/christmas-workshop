name: Publish Christmas Workshop
on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/publish-site.yml
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    env:
      PUBLISH_URL: https://make-it-merry-workshop.nuttymug23.chatgpt.site/_deploy
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish index.html to the existing site
        run: |
          set -euo pipefail
          page="$RUNNER_TEMP/christmas-workshop.html"
          curl --fail --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github.raw+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/index.html?ref=$GITHUB_SHA" \
            --output "$page"
          audience=$(jq -nr --arg value "$PUBLISH_URL" '$value|@uri')
          jwt_value=$(curl --fail --silent --show-error --retry 3 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$audience" | jq -er '.value')
          echo "::add-mask::$jwt_value"
          curl --fail-with-body --silent --show-error --retry 3 --max-time 40 \
            -H "Authorization: Bearer $jwt_value" \
            -H 'Content-Type: text/html; charset=utf-8' \
            --data-binary "@$page" "$PUBLISH_URL"
